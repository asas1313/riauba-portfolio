# Second, independent AI review on the PR itself (comments visible on GitHub).
# Runs only when the PR has the label "ai-review" to keep API costs under control.
name: claude-review
on:
  pull_request:
    types: [labeled, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: contains(github.event.pull_request.labels.*.name, 'ai-review')
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request using the rules in .claude/agents/reviewer.md
            and the spec linked in the PR description. Post findings as inline comments.
