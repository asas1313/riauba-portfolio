name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: make setup
      - run: make lint
      - run: make test
      - run: make security
      - run: make docs
      - run: make e2e
  visual:
    # Spec 005, AC-8/AC-11; see ADR-0004. Runs entirely inside the pinned
    # Playwright Docker image via GitHub Actions' native `container:` key
    # (no self-hosted Docker daemon or `docker run` wrapper needed here,
    # unlike the local `make visual`/`make visual-update` targets) so
    # baseline comparisons happen in the same reproducible rendering
    # environment on every run, never the bare `ubuntu-latest` image's own
    # font stack.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run build:pdf
      - run: npx playwright test --config=playwright.visual.config.ts
