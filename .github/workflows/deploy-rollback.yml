# Spec 004, AC-5: manual rollback, no rebuild -- just repoints `current` on
# the homelab via infra/rollback.sh. The chosen environment input doubles
# as the GitHub Environment name itself (`staging`/`production` are
# exactly the two configured environments), so `environment:
# ${{ inputs.env }}` alone gives the production-targeting run
# `environment: production` protection (required reviewer, once Andrius
# configures that environment protection rule -- see the runbook's
# "Repository hardening" section) without a separate conditional.
name: deploy-rollback
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to roll back (staging or production)"
        required: true
        type: choice
        options:
          - staging
          - production
      sha:
        description: "Optional: exact release sha to roll back to (default: the previous release)"
        required: false
# Defense in depth: infra/rollback.sh has no locking of its own, and this
# workflow shares its concurrency group with whichever of
# deploy-staging.yml/deploy-production.yml targets the same environment,
# so a rollback can never race a deploy (or another rollback) against the
# same environment and leave `current` pointing at a deleted directory.
concurrency:
  group: deploy-${{ github.event.inputs.env }}
  cancel-in-progress: false
jobs:
  rollback:
    # Security hardening: only Andrius' own actions can ever cause this
    # workflow to execute on the homelab runner, regardless of who can
    # trigger workflow_dispatch itself.
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, homelab-riauba]
    environment: ${{ github.event.inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - name: Roll back
        # Spec 004, security hardening: never interpolate free-form
        # workflow_dispatch inputs directly into `run:` text (the
        # documented GitHub Actions script-injection anti-pattern) --
        # pass them through `env:` and reference them as quoted shell
        # variables instead.
        env:
          ENV_INPUT: ${{ github.event.inputs.env }}
          SHA_INPUT: ${{ github.event.inputs.sha }}
        run: infra/rollback.sh "$ENV_INPUT" "$SHA_INPUT"
