# Spec 004, AC-2: every push to main builds with the staging SITE_URL on a
# GitHub-hosted runner, uploads dist/ as an artifact, then deploys it from
# the self-hosted homelab-riauba runner via infra/deploy.sh -- no secrets
# needed, since the runner only ever connects outbound to GitHub.
name: deploy-staging
on:
  push:
    branches: [main]
# Defense in depth: infra/deploy.sh's pruning step (`rm -rf` on computed
# non-keep releases) has no locking of its own, so two overlapping runs
# against staging could race and leave `current` pointing at a deleted
# directory. Serialize (never cancel) runs instead -- the same group name
# deploy-rollback.yml uses when its `env` input is "staging".
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make setup
      - env:
          SITE_URL: ${{ vars.SITE_URL }}
          NOINDEX: "true"
        run: make build
      - run: make docs SITE_DIR=dist/docs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          # actions/upload-artifact@v4 drops dotfiles by default, which
          # would silently strip astro.config.mjs's dist/.noindex sentinel
          # (infra/Caddyfile's @noindex matcher) before it ever reaches
          # the deploy job.
          include-hidden-files: true

  deploy:
    needs: build
    # Security hardening: only Andrius' own actions can ever cause this
    # workflow to execute on the homelab runner, regardless of who can
    # push to main.
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, homelab-riauba]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          DEPLOY_SHA: ${{ github.sha }}
        run: infra/deploy.sh staging "$DEPLOY_SHA" dist/
      # Review finding: a step-level `env:` block is scoped to that step
      # only -- it does not carry over to this sibling step, so SHA must
      # be set again here for AC-8's version-check to actually run
      # (`make smoke` only compares against /version.txt when SHA is
      # non-empty).
      - env:
          SHA: ${{ github.sha }}
        run: make smoke ENV=staging SHA="$SHA"
