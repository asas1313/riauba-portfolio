# Spec 004, AC-3: manual, confirm=deploy production deploy. The
# confirmation gate lives on the *first* job (resolve-ref) so nothing --
# not even ref resolution -- ever runs on the homelab runner without it
# (Security hardening). `ref` defaults to the sha currently live on
# staging (read from /srv/riauba/staging/DEPLOYED on the runner's own
# filesystem); either way, the resolved sha must be an ancestor of
# origin/main, so a `ref` input can never deploy an arbitrary/unmerged
# commit.
name: deploy-production
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
      ref:
        description: "Optional: exact commit sha to deploy (default: the sha currently live on staging)"
        required: false
# Defense in depth: infra/deploy.sh's pruning step (`rm -rf` on computed
# non-keep releases) has no locking of its own, so two overlapping
# deploy/rollback runs against the same environment could race and leave
# `current` pointing at a deleted directory. Serialize (never cancel) runs
# per environment instead -- the same group name deploy-rollback.yml uses
# when its `env` input is "production", so a production deploy and a
# production rollback can never race each other either.
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  resolve-ref:
    if: github.event.inputs.confirm == 'deploy' && github.actor == github.repository_owner
    runs-on: [self-hosted, homelab-riauba]
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        # Spec 004, security hardening: never interpolate a free-form
        # workflow_dispatch input directly into `run:` text (the
        # documented GitHub Actions script-injection anti-pattern -- a
        # crafted `ref` value could otherwise execute arbitrary shell on
        # the homelab runner). Pass it through `env:` and reference it as
        # a quoted shell variable instead.
        env:
          REF_INPUT: ${{ github.event.inputs.ref }}
        run: |
          if [ -n "$REF_INPUT" ]; then
            sha="$REF_INPUT"
          else
            sha="$(cut -d' ' -f1 /srv/riauba/staging/DEPLOYED)"
          fi
          git fetch origin main
          # Review finding: canonicalize to a full 40-char commit hash
          # before it's used for anything else. Without this, a short
          # sha, branch name or tag passed via `ref` would satisfy
          # `merge-base --is-ancestor` fine but then become the literal
          # release directory name under infra/deploy.sh, breaking the
          # "immutable, SHA-named release directories" invariant the
          # pruning/rollback log-walk logic relies on -- and a value
          # containing "/" (e.g. a branch name) would hard-fail
          # infra/deploy.sh's `cp -a` outright. `--end-of-options` also
          # defuses the unrelated, separate case of a ref value starting
          # with "-" being parsed as a flag by a later git/shell command.
          sha="$(git rev-parse --verify --end-of-options "$sha")"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "resolve-ref: '$sha' is not an ancestor of origin/main -- refusing to deploy" >&2
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  build:
    needs: resolve-ref
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: make setup
      - env:
          SITE_URL: ${{ vars.SITE_URL }}
          NOINDEX: ${{ vars.PROD_NOINDEX || 'true' }}
        run: make build
      - run: make docs SITE_DIR=dist/docs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          # actions/upload-artifact@v4 drops dotfiles by default, which
          # would silently strip astro.config.mjs's dist/.noindex sentinel
          # (infra/Caddyfile's @noindex matcher) before it ever reaches
          # the deploy job.
          include-hidden-files: true

  deploy:
    needs: [resolve-ref, build]
    # Security hardening: only Andrius' own actions can ever cause this
    # workflow to execute on the homelab runner.
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, homelab-riauba]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          RESOLVED_SHA: ${{ needs.resolve-ref.outputs.sha }}
        run: infra/deploy.sh production "$RESOLVED_SHA" dist/
      # Review finding: a step-level `env:` block is scoped to that step
      # only -- it does not carry over to this sibling step, so SHA must
      # be set again here for AC-8's version-check to actually run
      # (`make smoke` only compares against /version.txt when SHA is
      # non-empty).
      - env:
          SHA: ${{ needs.resolve-ref.outputs.sha }}
        run: make smoke ENV=production SHA="$SHA"
