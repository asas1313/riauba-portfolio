    highlights:
      - "Designed and built the product end-to-end, working AI-first with Claude Code as a daily coding agent."
      - "Built a JSON API designed to be consumed by an AI assistant."
      - "Built the Spring Boot calculation engine, a plain HTML front end, and a Python service integrating the Claude API for the AI assistant."
      - "Run separate staging and production environments, validating new features on staging before release."
      - "Self-host the development database and supporting services on a Proxmox homelab."

  - name: "State Child Rights Protection and Adoption Service (under the Ministry of Social Security and Labour)"
    position: "Senior Software Engineer"
    startDate: "2026-04"
    endDate: "2026-09"
    summary: "Government case-management system for child-protection business processes."
    highlights:
      - "Built a core system around Camunda (BPM engine) orchestrating business processes, backed by PostgreSQL and a set of Java microservices."
      - "Designed and implemented integrations with multiple external systems via REST and SOAP protocols."
      - "Worked within a regulated, data-sensitive government domain requiring strict process traceability and auditability."

  - name: "Baltic Amadeus"
    position: "Java Software Engineer"
    startDate: "2025-07"
    endDate: "2026-04"
    summary: >
      Government modernisation project at Registrų Centras (Lithuanian Center of Registers),
      one of Lithuania's critical public-sector registries. Acted as informal technical lead
      within a cross-functional development team.
    highlights:
      - "Analyzed the legacy system and contributed to the architecture of the new solution, defining service boundaries and integration patterns."
      - "Acted as an informal programming team lead: coordinated development tasks, conducted code reviews, and supported junior engineers."
      - "Designed and implemented new REST APIs and internal microservices applying Spring Boot best practices."
      - "Integrated Keycloak for identity and access management, AWS S3 for document storage, and new internal services replacing legacy components."
      - "Worked with a dual-database setup — Oracle (PL/SQL) for legacy data and PostgreSQL for new services — ensuring consistent data integrity across both."
      - "Used RabbitMQ for asynchronous event-driven communication between services."
      - "Maintained infrastructure as code with Terraform: upgraded Terraform and provider versions and migrated workloads to more cost-efficient server types, cutting hosting costs by ~30%."

  - name: "Danske Bank"
    position: "Java Software Engineer"
    startDate: "2023-02"
    endDate: "2025-07"
    summary: >
      Core member of a 13-person team (8 engineers) migrating Danske Bank's payment processing
      from a mainframe legacy system to a cloud-native microservices platform, handling SEPA,
      domestic and cross-border clearing. Several new customers were onboarded directly onto
      the cloud-native platform.
    highlights:
      - "Built payment gateway services in Java/Spring Boot processing SEPA, domestic and other clearing types."
      - "Built dynamic routing logic driven by a configurable rule set, selecting the clearing scheme per payment attributes without requiring code changes."
      - "Implemented JWT token validation, required-claims checks, and deduplication on inbound and outbound payment flows."
      - "Designed microservices communicating via Kafka for scalable, resilient payment event processing."
      - "Built Grafana dashboards and Prometheus alerts to monitor payment services in production."
      - "Operated within a fully automated CI/CD pipeline on Kubernetes, managed with Argo CD and GitHub Actions."
      - "Wrote unit, integration and load tests to validate service behavior under realistic traffic; used GitHub Copilot for AI-assisted development."

